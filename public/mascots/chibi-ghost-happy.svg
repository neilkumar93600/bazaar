<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none">
  <style>
    @keyframes happyBounce {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      35% { transform: translateY(-12px) scale(0.96, 1.04); }
      70% { transform: translateY(2px) scale(1.04, 0.96); }
      85% { transform: translateY(-2px) scale(1, 1); }
    }
    @keyframes handWave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-22deg); }
      50% { transform: rotate(10deg); }
      75% { transform: rotate(-22deg); }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.3) rotate(45deg); opacity: 1; }
    }
    @keyframes heartThump {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    .happy-rig {
      animation: happyBounce 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 100px 140px;
    }
    .waving-arm {
      animation: handWave 1.2s ease-in-out infinite;
      transform-origin: 158px 116px;
    }
    .star-sparkle {
      animation: starPulse 2.0s ease-in-out infinite;
      transform-origin: 38px 56px;
    }
    .heart-sparkle {
      animation: heartThump 2.0s ease-in-out 0.6s infinite;
      transform-origin: 173px 44px;
    }
    .happy-eye {
      animation: eyeBlink 3.8s ease-in-out infinite;
      transform-origin: center;
    }

    /* Hover Acceleration */
    svg:hover .happy-rig {
      animation-duration: 1.1s;
    }
    svg:hover .waving-arm {
      animation-duration: 0.7s;
    }

    @media (prefers-reduced-motion: reduce) {
      .happy-rig, .waving-arm, .star-sparkle, .heart-sparkle, .happy-eye {
        animation: none !important;
      }
    }
  </style>

  <!-- Sparkles & Hearts -->
  <g fill="#262626" stroke="#262626">
    <!-- Star top left -->
    <g class="star-sparkle">
      <path d="M 38 48 L 40 54 L 46 56 L 40 58 L 38 64 L 36 58 L 30 56 L 36 54 Z" stroke-width="0.5" />
    </g>
    <!-- Mini heart top right -->
    <g class="heart-sparkle">
      <path d="M 166 42 C 166 38 170 36 173 39 C 176 36 180 38 180 42 C 180 47 173 51 173 51 C 173 51 166 47 166 42 Z" stroke-width="1" />
    </g>
    <circle cx="160" cy="74" r="2" />
    <circle cx="34" cy="98" r="1.5" />
    <circle cx="172" cy="148" r="2" />
    <path d="M 30 145 L 34 145 M 32 143 L 32 147" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Happy Ghost Body with Swaying Curve -->
  <g class="happy-rig">
    <path
      d="
        M 100 44
        C 62 44 48 76 48 116
        C 48 152 46 172 54 192
        C 58 202 68 200 74 192
        C 80 184 90 184 96 192
        C 102 200 112 200 118 192
        C 124 184 134 184 140 192
        C 146 200 156 198 160 188
        C 166 172 164 150 162 116
        C 160 76 138 44 100 44
        Z
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Waved Ruffle Underbelly -->
    <path
      d="
        M 52 176
        C 60 186 70 186 76 178
        C 82 170 92 170 98 178
        C 104 186 114 186 120 178
        C 126 170 136 170 142 178
        C 148 184 154 180 156 176
      "
      fill="none"
      stroke="#262626"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Eyes (Big glowing chibi eyes with happy shine) -->
    <!-- Left Eye -->
    <g class="happy-eye" style="transform-origin: 82px 110px;">
      <ellipse cx="82" cy="110" rx="9" ry="16" fill="#262626" />
      <ellipse cx="82" cy="104" rx="3.5" ry="7" fill="#ffffff" />
      <circle cx="82" cy="118" r="2.5" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g class="happy-eye" style="transform-origin: 120px 110px;">
      <ellipse cx="120" cy="110" rx="9" ry="16" fill="#262626" />
      <ellipse cx="120" cy="104" rx="3.5" ry="7" fill="#ffffff" />
      <circle cx="120" cy="118" r="2.5" fill="#ffffff" />
    </g>

    <!-- Cute Happy Open Mouth -->
    <path
      d="M 96 128 C 96 135 106 135 106 128 Z"
      fill="#262626"
      stroke="#262626"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Cute Cheerful Blush Lines -->
    <g stroke="#262626" stroke-width="2" stroke-linecap="round">
      <line x1="62" y1="122" x2="66" y2="130" />
      <line x1="67" y1="121" x2="71" y2="129" />
      <line x1="72" y1="122" x2="76" y2="130" />

      <line x1="126" y1="122" x2="130" y2="130" />
      <line x1="131" y1="121" x2="135" y2="129" />
      <line x1="136" y1="122" x2="140" y2="130" />
    </g>

    <!-- Waving Arm (Right) -->
    <g class="waving-arm">
      <path
        d="
          M 158 116
          C 168 110 178 98 174 90
          C 170 84 162 90 156 102
        "
        fill="#ffffff"
        stroke="#262626"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- Resting Arm (Left) -->
    <path
      d="
        M 50 120
        C 42 124 40 132 46 136
        C 52 138 56 132 54 126
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
