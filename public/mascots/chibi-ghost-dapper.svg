<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @keyframes dapperFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }
    @keyframes hatBob {
      0%, 100% { transform: translateY(0px) rotate(-12deg); }
      40% { transform: translateY(-3px) rotate(-14deg); }
      75% { transform: translateY(1px) rotate(-10deg); }
    }
    @keyframes sparkleTwinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50% { transform: scale(1.25) rotate(45deg); opacity: 1; }
    }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-5px); opacity: 0.9; }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }

    .dapper-rig {
      animation: dapperFloat 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      transform-origin: 100px 120px;
    }
    .dapper-hat-rig {
      animation: hatBob 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      transform-origin: 108px 42px;
    }
    .sparkle-group-1 {
      animation: sparkleTwinkle 2.4s ease-in-out infinite;
      transform-origin: 36px 53px;
    }
    .sparkle-group-2 {
      animation: sparkleTwinkle 2.4s ease-in-out 1.2s infinite;
      transform-origin: 168px 60px;
    }
    .sparkle-float {
      animation: sparkleFloat 3s ease-in-out infinite;
    }
    .dapper-eye-ball {
      animation: eyeBlink 4.2s ease-in-out infinite;
    }

    /* Interactive Hover Polish */
    svg:hover .dapper-hat-rig {
      animation-duration: 1.8s;
      transform: translateY(-6px) rotate(-18deg);
      transition: transform 0.3s ease;
    }
    svg:hover .sparkle-group-1,
    svg:hover .sparkle-group-2 {
      animation-duration: 1.2s;
    }

    @media (prefers-reduced-motion: reduce) {
      .dapper-rig, .dapper-hat-rig, .sparkle-group-1, .sparkle-group-2, .sparkle-float, .dapper-eye-ball {
        animation: none !important;
      }
    }
  </style>

  <!-- Sparkles and stars around -->
  <g class="sparkle-float" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top left sparkle -->
    <g class="sparkle-group-1">
      <path d="M36 48 L36 58 M31 53 L41 53" />
      <circle cx="28" cy="68" r="1.5" fill="#262626" />
    </g>
    <!-- Top right sparkle -->
    <g class="sparkle-group-2">
      <path d="M168 56 L168 64 M164 60 L172 60" />
      <path d="M178 76 Q181 74 184 76 Q181 78 178 76" fill="#262626" />
    </g>
    <!-- Little floating hearts / dots -->
    <path d="M162 130 C162 126 166 124 169 127 C172 124 176 126 176 130 C176 135 169 139 169 139 C169 139 162 135 162 130 Z" fill="#262626" />
    <circle cx="32" cy="142" r="2" fill="#262626" />
    <circle cx="42" cy="154" r="1.5" fill="#262626" />
  </g>

  <!-- Main Ghost Body with Dapper Pose -->
  <g class="dapper-rig" filter="url(#soft-shadow)">
    <!-- Ghost Body -->
    <path
      d="
        M 100 48
        C 65 48 50 78 50 115
        C 50 148 54 172 62 188
        C 66 196 74 195 79 188
        C 84 181 92 182 96 188
        C 100 194 108 195 113 189
        C 118 183 126 184 130 190
        C 134 196 142 195 146 188
        C 152 178 156 145 156 112
        C 156 75 138 48 100 48
        Z
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Ruffled Lower Layer (Double hemline fluff) -->
    <path
      d="
        M 56 172
        C 62 182 72 182 78 174
        C 84 166 94 166 100 174
        C 106 182 116 182 122 174
        C 128 166 138 167 144 175
        C 148 181 154 178 155 172
      "
      fill="none"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Top Hat ("Dapper Blook") -->
    <g class="dapper-hat-rig">
      <!-- Hat Base/Brim -->
      <ellipse cx="108" cy="46" rx="28" ry="7" fill="#ffffff" stroke="#262626" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Hat Crown -->
      <path
        d="
          M 90 44
          L 92 16
          C 92 12 96 10 108 10
          C 120 10 124 12 124 16
          L 126 44
          Z
        "
        fill="#ffffff"
        stroke="#262626"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Hat Ribbon / Band -->
      <path
        d="M 91.5 35 C 100 38 116 38 124.5 35 L 125.5 42 C 117 45 101 45 91 42 Z"
        fill="#262626"
      />
      <!-- Hat Top highlight rim -->
      <ellipse cx="108" cy="16" rx="16" ry="4" fill="#ffffff" stroke="#262626" stroke-width="3" />
      <!-- Tiny shine on hat -->
      <path d="M 97 20 L 98 30" stroke="#262626" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Eyes (Iconic Chibi Oval Inky Eyes) - ONLY EYE IS ANIMATED -->
    <!-- Left Eye Ball -->
    <g class="dapper-eye-ball" style="transform-origin: 85px 112px;">
      <ellipse cx="85" cy="112" rx="9" ry="17" fill="#262626" />
      <!-- Specular Highlight / Vertical shine -->
      <ellipse cx="85" cy="106" rx="3.5" ry="7.5" fill="#ffffff" />
      <circle cx="85" cy="120" r="2.5" fill="#ffffff" />
    </g>
    <!-- Left Static Teardrop on Cheek -->
    <path
      d="M 85 130 C 82 135 80 142 82 146 C 84 150 88 150 90 146 C 92 142 88 135 85 130 Z"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Right Eye Ball -->
    <g class="dapper-eye-ball" style="transform-origin: 121px 112px;">
      <ellipse cx="121" cy="112" rx="9" ry="17" fill="#262626" />
      <!-- Specular Highlight / Vertical shine -->
      <ellipse cx="121" cy="106" rx="3.5" ry="7.5" fill="#ffffff" />
      <circle cx="121" cy="120" r="2.5" fill="#ffffff" />
    </g>
    <!-- Right Static Teardrop on Cheek -->
    <path
      d="M 121 130 C 118 135 116 142 118 146 C 120 150 124 150 126 146 C 128 142 124 135 121 130 Z"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Shy Blush Lines (Chibi `///`) -->
    <g stroke="#262626" stroke-width="2" stroke-linecap="round">
      <!-- Left cheek -->
      <line x1="64" y1="126" x2="68" y2="134" />
      <line x1="69" y1="125" x2="73" y2="133" />
      <line x1="74" y1="126" x2="78" y2="134" />
      <!-- Right cheek -->
      <line x1="128" y1="126" x2="132" y2="134" />
      <line x1="133" y1="125" x2="137" y2="133" />
      <line x1="138" y1="126" x2="142" y2="134" />
    </g>

    <!-- Tiny Cute Mouth (Hesitant Shy Smile / Dot) -->
    <path
      d="M 100 134 C 102 136 104 136 106 134"
      fill="none"
      stroke="#262626"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Tiny Cute Little Ghost Hands / Stubs -->
    <path
      d="M 54 128 C 48 132 46 138 52 141 C 58 143 62 136 60 130"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 152 128 C 158 132 160 138 154 141 C 148 143 144 136 146 130"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
