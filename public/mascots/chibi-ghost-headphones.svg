<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none">
  <style>
    @keyframes musicBop {
      0%, 100% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
      30% { transform: translateY(-7px) scale(0.98, 1.02) rotate(1deg); }
      60% { transform: translateY(2px) scale(1.02, 0.98) rotate(-1deg); }
      80% { transform: translateY(-2px) scale(1, 1) rotate(0deg); }
    }
    @keyframes noteFloat1 {
      0% { transform: translate(0px, 0px) scale(0.8); opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 0.9; }
      100% { transform: translate(10px, -24px) scale(1.1); opacity: 0; }
    }
    @keyframes noteFloat2 {
      0% { transform: translate(0px, 0px) scale(0.8); opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 0.9; }
      100% { transform: translate(-12px, -22px) scale(1.15); opacity: 0; }
    }
    @keyframes noteFloat3 {
      0% { transform: translate(0px, 0px) scale(0.8); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translate(8px, -18px) scale(1.05); opacity: 0; }
    }
    @keyframes earPulse {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.06); }
      60% { transform: scale(0.98); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }

    .headphones-rig {
      animation: musicBop 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 100px 140px;
    }
    .note-1 {
      animation: noteFloat1 2.2s ease-out infinite;
      transform-origin: 175px 45px;
    }
    .note-2 {
      animation: noteFloat2 2.6s ease-out 0.8s infinite;
      transform-origin: 40px 50px;
    }
    .note-3 {
      animation: noteFloat3 2.4s ease-out 1.4s infinite;
      transform-origin: 170px 145px;
    }
    .left-cup {
      animation: earPulse 1.6s ease-in-out infinite;
      transform-origin: 44px 113px;
    }
    .right-cup {
      animation: earPulse 1.6s ease-in-out infinite;
      transform-origin: 162px 113px;
    }
    .headphones-eye-ball {
      animation: eyeBlink 3.8s ease-in-out infinite;
    }

    /* Hover Acceleration */
    svg:hover .headphones-rig {
      animation-duration: 1.0s;
    }
    svg:hover .note-1, svg:hover .note-2, svg:hover .note-3 {
      animation-duration: 1.4s;
    }

    @media (prefers-reduced-motion: reduce) {
      .headphones-rig, .note-1, .note-2, .note-3, .left-cup, .right-cup, .headphones-eye-ball {
        animation: none !important;
      }
    }
  </style>

  <!-- Musical notes floating around -->
  <g fill="#262626" stroke="#262626">
    <!-- Top Right Music Note ♪ -->
    <path class="note-1" d="M 166 45 C 166 40 178 35 182 38 L 182 52 C 178 50 172 50 170 54 C 167 58 171 63 175 62 C 179 61 183 57 183 50 L 183 36 C 183 34 180 32 176 34 L 168 37 C 166 38 165 40 165 43 L 165 58 C 161 56 155 56 153 60 C 150 64 154 69 158 68 C 162 67 166 63 166 56 Z" stroke-width="1" />
    
    <!-- Top Left Single Note ♩ -->
    <path class="note-2" d="M 38 60 L 38 42 C 38 40 40 38 44 40 L 48 42 L 48 45 L 42 43 L 42 62 C 38 60 32 60 30 64 C 27 68 31 73 35 72 C 39 71 43 67 43 60 Z" stroke-width="0.8" />
    
    <!-- Small floating note near bottom right -->
    <path class="note-3" d="M 168 150 L 168 138 C 168 136 172 135 174 136 L 174 152 C 171 150 167 150 165 153 C 163 156 166 160 169 159 C 172 158 174 155 174 150 Z" stroke-width="0.5" />
    
    <!-- Little sparkles -->
    <circle cx="160" cy="110" r="1.5" />
    <circle cx="34" cy="120" r="1.5" />
    <circle cx="172" cy="95" r="2" />
  </g>

  <!-- Ghost Body with Cloud Ruffles -->
  <g class="headphones-rig">
    <!-- Body -->
    <path
      d="
        M 100 52
        C 65 52 52 82 52 118
        C 52 155 54 175 60 188
        C 65 196 73 196 78 189
        C 83 182 91 182 96 189
        C 101 196 109 196 114 189
        C 119 182 127 182 132 189
        C 137 196 145 196 150 188
        C 156 175 158 155 158 118
        C 158 82 145 52 100 52
        Z
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower Cloud/Bubble Hemline Trim -->
    <path
      d="
        M 56 175
        C 62 184 72 184 78 176
        C 84 168 94 168 100 176
        C 106 184 116 184 122 176
        C 128 168 138 169 144 177
        C 148 183 154 180 155 175
      "
      fill="none"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Eyes (Big Chibi Inky Tearful Eyes) - ONLY EYE BALL BLINKS -->
    <!-- Left Eye Ball -->
    <g class="headphones-eye-ball" style="transform-origin: 84px 112px;">
      <ellipse cx="84" cy="112" rx="9.5" ry="17.5" fill="#262626" />
      <ellipse cx="84" cy="106" rx="3.5" ry="8" fill="#ffffff" />
      <circle cx="84" cy="121" r="2.5" fill="#ffffff" />
    </g>
    
    <!-- Left Eye Static Teardrop on Cheek -->
    <path
      d="M 84 130 C 81 135 79 143 81 147 C 83 151 87 151 89 147 C 91 143 87 135 84 130 Z"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Right Eye Ball -->
    <g class="headphones-eye-ball" style="transform-origin: 122px 112px;">
      <ellipse cx="122" cy="112" rx="9.5" ry="17.5" fill="#262626" />
      <ellipse cx="122" cy="106" rx="3.5" ry="8" fill="#ffffff" />
      <circle cx="122" cy="121" r="2.5" fill="#ffffff" />
    </g>

    <!-- Right Eye Static Teardrop on Cheek -->
    <path
      d="M 122 130 C 119 135 117 143 119 147 C 121 151 125 151 127 147 C 129 143 125 135 122 130 Z"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Tiny Shy Smile / Chill Expression -->
    <path
      d="M 100 134 C 102 137 106 137 108 134"
      fill="none"
      stroke="#262626"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Little Cassette Tape or Walkman in Hands -->
    <g transform="translate(86, 142) rotate(-3)">
      <rect x="0" y="0" width="34" height="24" rx="4" fill="#ffffff" stroke="#262626" stroke-width="3" />
      <rect x="5" y="4" width="24" height="11" rx="2" fill="#ffffff" stroke="#262626" stroke-width="1.8" />
      <circle cx="11" cy="9.5" r="2.5" fill="#262626" />
      <circle cx="23" cy="9.5" r="2.5" fill="#262626" />
      <line x1="8" y1="19" x2="26" y2="19" stroke="#262626" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 14 6.5 L 20 6.5" stroke="#262626" stroke-width="1.5" />
    </g>

    <!-- Ghost Cute Arms Holding the Music Player -->
    <path
      d="M 68 138 C 72 146 80 152 86 150 C 90 148 88 142 82 140"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 138 138 C 134 146 126 152 120 150 C 116 148 118 142 124 140"
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Over-Ear Headphones (Thick band, plush ear cups) -->
    <!-- Headband Arc -->
    <path
      d="M 46 112 C 44 60 70 34 103 34 C 136 34 162 60 160 112"
      fill="none"
      stroke="#262626"
      stroke-width="8"
      stroke-linecap="round"
    />
    <path
      d="M 52 110 C 50 66 74 42 103 42 C 132 42 156 66 154 110"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Left Ear Cup -->
    <g class="left-cup">
      <rect x="34" y="94" width="20" height="38" rx="10" fill="#262626" stroke="#262626" stroke-width="2" />
      <rect x="42" y="98" width="10" height="30" rx="5" fill="#3f3f46" />
      <ellipse cx="40" cy="113" rx="3" ry="12" fill="#ffffff" opacity="0.25" />
    </g>

    <!-- Right Ear Cup -->
    <g class="right-cup">
      <rect x="152" y="94" width="20" height="38" rx="10" fill="#262626" stroke="#262626" stroke-width="2" />
      <rect x="154" y="98" width="10" height="30" rx="5" fill="#3f3f46" />
      <ellipse cx="166" cy="113" rx="3" ry="12" fill="#ffffff" opacity="0.25" />
    </g>
  </g>
</svg>
