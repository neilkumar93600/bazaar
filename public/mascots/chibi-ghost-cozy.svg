<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <filter id="soft-shadow-cozy" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    @keyframes cozyBreathe {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      50% { transform: translateY(-4px) scale(1.02, 0.98); }
    }
    @keyframes zzzFloat1 {
      0% { transform: translate(0px, 8px) scale(0.7); opacity: 0; }
      40% { opacity: 0.9; }
      100% { transform: translate(-8px, -18px) scale(1.1); opacity: 0; }
    }
    @keyframes zzzFloat2 {
      0% { transform: translate(0px, 6px) scale(0.6); opacity: 0; }
      40% { opacity: 0.9; }
      100% { transform: translate(-12px, -24px) scale(1.15); opacity: 0; }
    }
    @keyframes nightcapSway {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .sleeper-rig {
      animation: cozyBreathe 4.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      transform-origin: 110px 120px;
    }
    .nightcap-rig {
      animation: nightcapSway 4.2s ease-in-out infinite;
      transform-origin: 108px 77px;
    }
    .zzz-1 {
      animation: zzzFloat1 2.8s ease-out infinite;
    }
    .zzz-2 {
      animation: zzzFloat2 2.8s ease-out 1.2s infinite;
    }
    .star-twinkle-1 {
      animation: starTwinkle 2.4s ease-in-out infinite;
      transform-origin: 125px 140px;
    }
    .star-twinkle-2 {
      animation: starTwinkle 2.4s ease-in-out 0.8s infinite;
      transform-origin: 152px 138px;
    }
    .star-twinkle-3 {
      animation: starTwinkle 2.4s ease-in-out 1.6s infinite;
      transform-origin: 140px 158px;
    }

    svg:hover .sleeper-rig {
      animation-duration: 2.5s;
    }
    svg:hover .nightcap-rig {
      animation-duration: 2.0s;
    }

    @media (prefers-reduced-motion: reduce) {
      .sleeper-rig, .nightcap-rig, .zzz-1, .zzz-2, .star-twinkle-1, .star-twinkle-2, .star-twinkle-3 {
        animation: none !important;
      }
    }
  </style>

  <!-- Floating 'z z Z' drifting up and fading, classic sleep cycle -->
  <g fill="#262626" stroke="#262626">
    <path class="zzz-1" d="M 68 36 L 76 36 L 68 46 L 77 46" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path class="zzz-2" d="M 52 24 L 62 24 L 52 36 L 63 36" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mini star -->
    <path d="M 40 48 L 41 52 L 45 53 L 41 54 L 40 58 L 39 54 L 35 53 L 39 52 Z" />
    <circle cx="86" cy="28" r="1.5" />
    <circle cx="32" cy="30" r="1.5" />
  </g>

  <!-- Mattress / Bed Base (fixed — only the sleeper breathes) -->
  <g filter="url(#soft-shadow-cozy)">
    <!-- Bed frame / mattress 3D box -->
    <path
      d="
        M 50 140
        L 95 168
        L 190 128
        L 145 100
        Z
      "
      fill="#f4f4f5"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <path
      d="
        M 50 140
        L 50 152
        L 95 180
        L 95 168
        Z
      "
      fill="#e4e4e7"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <path
      d="
        M 95 168
        L 95 180
        L 190 140
        L 190 128
        Z
      "
      fill="#d4d4d8"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Sleeper: pillow, head, hat, blanket -->
    <g class="sleeper-rig">
      <!-- Pillow -->
      <path
        d="
          M 75 116
          C 70 110 74 102 85 96
          C 96 90 110 92 118 100
          C 124 106 122 114 112 120
          C 102 126 84 124 75 116
          Z
        "
        fill="#ffffff"
        stroke="#262626"
        stroke-width="3"
        stroke-linejoin="round"
      />

      <!-- Ghost Head Resting on Pillow -->
      <path
        d="
          M 86 85
          C 75 88 68 98 70 112
          C 72 124 82 135 96 138
          C 112 140 130 134 135 120
          C 140 106 135 90 120 82
          C 108 76 95 78 86 85
          Z
        "
        fill="#ffffff"
        stroke="#262626"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Sleeping Eyes -->
      <path
        d="M 86 112 C 90 118 97 118 100 112"
        fill="none"
        stroke="#262626"
        stroke-width="3.5"
        stroke-linecap="round"
      />
      <path
        d="M 100 116 C 102 119 101 123 99 124 C 97 125 95 123 96 120 Z"
        fill="#262626"
      />

      <!-- Soft blush lines on cheek -->
      <line x1="80" y1="122" x2="84" y2="127" stroke="#262626" stroke-width="1.8" stroke-linecap="round" />
      <line x1="85" y1="121" x2="89" y2="126" stroke="#262626" stroke-width="1.8" stroke-linecap="round" />

      <!-- Cute Nightcap / Sleeping Hat -->
      <g class="nightcap-rig">
        <path
          d="
            M 98 75
            C 105 52 120 40 138 48
            C 148 54 150 66 142 74
            C 134 80 126 78 120 78
            Z
          "
          fill="#ffffff"
          stroke="#262626"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <ellipse cx="108" cy="77" rx="14" ry="5" fill="#ffffff" stroke="#262626" stroke-width="3" />
        <path d="M 118 58 L 120 62 L 124 63 L 120 65 L 121 69 L 117 66 L 114 68 L 115 64 L 112 62 L 116 61 Z" fill="#262626" />
        <circle cx="145" cy="74" r="6" fill="#ffffff" stroke="#262626" stroke-width="3" />
      </g>

      <!-- Starry Quilt / Blanket draped over ghost -->
      <path
        d="
          M 94 125
          C 108 116 130 114 150 118
          C 168 122 195 132 192 152
          C 188 168 160 178 135 174
          C 114 170 96 160 92 144
          C 90 136 91 129 94 125
          Z
        "
        fill="#ffffff"
        stroke="#262626"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Blanket Fold / Rim -->
      <path
        d="
          M 94 126
          C 110 120 130 118 148 122
          C 158 124 165 128 168 132
        "
        fill="none"
        stroke="#262626"
        stroke-width="2.5"
        stroke-linecap="round"
      />

      <!-- Cute Star Patterns on Blanket, twinkling -->
      <g class="star-twinkle-1">
        <path d="M 125 136 L 126.5 140 L 131 141 L 127 143.5 L 128 148 L 124 145 L 120 147.5 L 121.5 143 L 118 140.5 L 122.5 140 Z" fill="#262626" />
      </g>
      <g class="star-twinkle-2">
        <path d="M 152 134 L 153 137 L 156.5 138 L 153.5 140 L 154.5 143.5 L 151.5 141.5 L 148.5 143.5 L 149.5 140 L 147 138 L 150.5 137.5 Z" fill="#262626" />
      </g>
      <g class="star-twinkle-3">
        <path d="M 140 154 L 141 157 L 144.5 158 L 141.5 160 L 142.5 163.5 L 139.5 161.5 L 136.5 163.5 L 137.5 160 L 135 158 L 138.5 157.5 Z" fill="#262626" />
      </g>
      <path d="M 168 146 L 169 148.5 L 172 149.5 L 169.5 151 L 170.5 154 L 168 152.5 L 165.5 154 L 166.5 151 L 164.5 149.5 L 167 149 Z" fill="#262626" opacity="0.6" />

      <!-- Cute little ghost hand holding blanket edge -->
      <path
        d="M 110 126 C 108 122 102 122 100 126 C 98 130 104 133 108 131"
        fill="#ffffff"
        stroke="#262626"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
