<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none">
  <style>
    @keyframes uploadFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-1deg); }
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateY(8px) scale(0.95); opacity: 0.7; }
      50% { transform: translateY(-8px) scale(1.1); opacity: 1; }
    }
    @keyframes photoRock {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes dashFlicker {
      0%, 100% { opacity: 0.2; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }

    .uploading-rig {
      animation: uploadFloat 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      transform-origin: 100px 130px;
    }
    .upload-arrow-rig {
      animation: arrowBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 92px 15px;
    }
    .photo-stack-rig {
      animation: photoRock 2.4s ease-in-out infinite;
      transform-origin: 92px 48px;
    }
    .dash-1 {
      animation: dashFlicker 0.9s ease-in-out infinite;
    }
    .dash-2 {
      animation: dashFlicker 0.9s ease-in-out 0.45s infinite;
    }
    .upload-eye {
      animation: eyeBlink 3.8s ease-in-out infinite;
    }

    /* Hover Acceleration */
    svg:hover .uploading-rig {
      animation-duration: 1.4s;
    }
    svg:hover .upload-arrow-rig {
      animation-duration: 0.7s;
    }

    @media (prefers-reduced-motion: reduce) {
      .uploading-rig, .upload-arrow-rig, .photo-stack-rig, .dash-1, .dash-2, .upload-eye {
        animation: none !important;
      }
    }
  </style>

  <!-- Ghost Body -->
  <g class="uploading-rig">
    <path
      d="
        M 100 60
        C 62 60 48 92 48 132
        C 48 168 46 188 54 208
        C 58 218 68 216 74 208
        C 80 200 90 200 96 208
        C 102 216 112 216 118 208
        C 124 200 134 200 140 208
        C 146 216 156 214 160 204
        C 166 188 164 166 162 132
        C 160 92 138 60 100 60
        Z
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Ruffled hem -->
    <path
      d="
        M 52 192
        C 60 202 70 202 76 194
        C 82 186 92 186 98 194
        C 104 202 114 202 120 194
        C 126 186 136 186 142 194
        C 148 200 154 198 156 194
      "
      fill="none"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Eyes (alert, open) -->
    <g class="upload-eye" style="transform-origin: 82px 126px;">
      <ellipse cx="82" cy="126" rx="9" ry="16" fill="#262626" />
      <ellipse cx="82" cy="120" rx="3.5" ry="7" fill="#ffffff" />
      <circle cx="82" cy="134" r="2.5" fill="#ffffff" />
    </g>
    <g class="upload-eye" style="transform-origin: 120px 126px;">
      <ellipse cx="120" cy="126" rx="9" ry="16" fill="#262626" />
      <ellipse cx="120" cy="120" rx="3.5" ry="7" fill="#ffffff" />
      <circle cx="120" cy="134" r="2.5" fill="#ffffff" />
    </g>

    <!-- Small concentrating "o" mouth -->
    <ellipse cx="101" cy="146" rx="4" ry="5" fill="#262626" />

    <!-- Raised arms supporting photo stack -->
    <path
      d="
        M 56 150
        C 46 128 50 94 68 62
        C 74 60 78 66 74 72
        C 64 96 60 124 64 146
        Z
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="
        M 144 150
        C 154 128 150 94 132 62
        C 126 60 122 66 126 72
        C 136 96 140 124 136 146
        Z
      "
      fill="#ffffff"
      stroke="#262626"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Stack of tiny photo squares held overhead -->
    <g class="photo-stack-rig" stroke="#262626" stroke-width="3" stroke-linejoin="round">
      <rect x="76" y="48" width="26" height="20" rx="3" fill="#ffffff" transform="rotate(-6 89 58)" />
      <rect x="82" y="40" width="26" height="20" rx="3" fill="#ffffff" transform="rotate(4 95 50)" />
      <rect x="79" y="32" width="26" height="20" rx="3" fill="#ffffff" />
    </g>

    <!-- Lime upload arrow above the stack, bouncing up into the stack -->
    <g class="upload-arrow-rig" stroke="#a3e635" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 92 24 L 92 6" />
      <path d="M 84 14 L 92 6 L 100 14" />
    </g>

    <!-- Little motion dashes flickering beside the arms -->
    <g stroke="#262626" stroke-width="2" stroke-linecap="round">
      <path class="dash-1" d="M 34 92 L 40 96" />
      <path class="dash-2" d="M 30 106 L 37 108" />
      <path class="dash-1" d="M 160 92 L 154 96" />
      <path class="dash-2" d="M 164 106 L 157 108" />
    </g>
  </g>
</svg>
