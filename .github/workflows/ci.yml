name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # tsc needs Next's generated route types (PageProps<...>) - typegen
      # writes those without a full build, which would need Supabase env vars.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
